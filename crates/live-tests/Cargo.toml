# Billed tests against the live API; see src/lib.rs. Never a default member.
# `publish = false`: it is not a library anybody depends on.
[package]
name = "decision-model-sdk-live-tests"
version = "0.0.0"
description = "Tests of decision-model-sdk against the live TypeSafe AI System One API"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "live_tests"

[dependencies]
# Default features: the typed test uses the derive.
decision-model-sdk = { path = "../sdk" }

[dev-dependencies]
# A criteria object for the raw-shaped question, as the Python test spells it.
serde = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
