# Billed tests of the adapter against the vendors' live APIs; see src/lib.rs.
# Never a default member. `publish = false`: it is not a library anybody
# depends on.
[package]
name = "decision-model-adapter-live-tests"
version = "0.0.0"
description = "Tests of decision-model-adapter against the live OpenAI, Anthropic and Gemini APIs"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "adapter_live_tests"

[dependencies]
# Default features: every built-in provider.
decision-model-adapter = { path = "../adapter" }

[dev-dependencies]
# An async runtime for the tests (`#[tokio::test]`).
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
