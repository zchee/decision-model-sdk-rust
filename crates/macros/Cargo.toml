[package]
name = "decision-model-sdk-macros"
version = "0.1.0"
description = "#[derive(QuestionSet)] for decision-model-sdk: decision model questions serialized at compile time"
readme = "README.md"
keywords = ["decision-model", "ai", "derive", "sdk"]
categories = ["api-bindings", "development-tools::procedural-macro-helpers"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
