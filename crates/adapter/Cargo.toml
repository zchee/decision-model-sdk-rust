[package]
name = "decision-model-adapter"
version = "0.1.0"
categories = ["api-bindings", "asynchronous"]
edition.workspace = true
# A release ships the library, the README the crate docs embed and the
# licenses. The tests stay here: their recorded fixtures are upstream material
# and they build against the test-support crate, which is never published.
include = ["/src", "/README.md", "/LICENSE", "/LICENSE-THIRD-PARTY"]
keywords = ["decision-model", "llm", "openai", "anthropic", "gemini"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Ask System One questions of an OpenAI, Anthropic or Gemini model instead of a decision model"

# Every public feature except `internals`, whose module carries no semver
# promise and is hidden from the documentation.
[package.metadata.docs.rs]
features = ["openai", "anthropic", "gemini", "tracing", "macros"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["openai", "anthropic", "gemini", "tracing"]
# Each built-in provider sends its requests over the default transport:
# hyper-util's pooled client over hyper-rustls, with the trust anchors from
# the operating system. A client without any of them still takes a provider
# the caller implements.
openai = ["dep:hyper", "dep:hyper-util", "dep:hyper-rustls", "dep:rustls", "dep:rustls-platform-verifier", "dep:tower-service"]
anthropic = ["dep:hyper", "dep:hyper-util", "dep:hyper-rustls", "dep:rustls", "dep:rustls-platform-verifier", "dep:tower-service"]
gemini = ["dep:hyper", "dep:hyper-util", "dep:hyper-rustls", "dep:rustls", "dep:rustls-platform-verifier", "dep:tower-service"]
# Forwarded to the SDK on purpose: the SDK's retry line is emitted only under
# its own `tracing` feature, and the SDK is a dependency without its defaults.
tracing = ["dep:tracing", "decision-model-sdk/tracing"]
# Exposes `decision_model_adapter::__internals`, the entry points the parity tests
# and the fuzz targets call. It carries no semver promise and is never on by
# default.
internals = []
# `#[derive(QuestionSet)]` through the re-exported `QuestionSet`; it forwards
# to the SDK's feature and re-exports nothing by itself.
macros = ["decision-model-sdk/macros"]

[dependencies]
bytes = { workspace = true }
http = { workspace = true }
# A provider's request body implements this version of `http_body::Body`, the
# one bound the SDK's transport seam shares.
http-body = { workspace = true }
# `Limited` collects a response body under the size cap.
http-body-util = { workspace = true }
hyper = { workspace = true, optional = true }
hyper-rustls = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
# Holds a provider's key until the one place that turns it into a header
# value, so no formatting of a provider or a client can print it.
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The per-attempt deadline, and `sync` for the client's cache of the providers
# it builds itself, which exists in every feature set.
tokio = { workspace = true, features = ["sync"] }
tower-service = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# Without its defaults: the adapter needs neither the SDK's transport nor its
# derive, and a feature of this crate turns on the SDK's when it needs one.
decision-model-sdk = { version = "0.1.0", path = "../sdk", default-features = false }

# No entry for the SDK here: a dev-dependency that enabled an SDK feature would
# unify into every build of this crate's tests and hide a missing forward.
[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# Unconditional, unlike the library's: the tests' event recorder implements a
# `tracing` subscriber.
tracing = { workspace = true }
# Path only, no version: cargo strips a path dev-dependency when it publishes,
# and this crate is never published.
decision-model-sdk-test-support = { path = "../test-support" }

[[test]]
name = "client"

[[test]]
name = "typed"
required-features = ["macros"]

[[test]]
name = "lifecycle"
required-features = ["internals", "openai", "anthropic"]

[[test]]
name = "providers_openai"
required-features = ["internals", "openai"]

[[test]]
name = "providers_anthropic"
required-features = ["internals", "anthropic"]

[[test]]
name = "providers_gemini"
required-features = ["internals", "gemini"]

[[test]]
name = "cassettes"
required-features = ["internals", "openai", "anthropic", "gemini"]

[[test]]
name = "parity_schema"
required-features = ["internals"]

[[test]]
name = "parity_metrics"
required-features = ["internals"]

[lints]
workspace = true
