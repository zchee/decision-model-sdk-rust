name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A superseded run tells nobody anything, so the newest push on a branch
# cancels the ones it replaced. `main` is exempt: its runs are the record of
# what the branch was in, and cancelling one would leave a commit unverified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A test that fails on a runner cannot be re-run under a debugger, so the
  # backtrace has to be in the log the first time.
  RUST_BACKTRACE: 1

jobs:
  # The whole gate, on each supported platform. The steps share one job rather
  # than being split into several because they share a target directory:
  # splitting them would compile the crate once per step instead of once per
  # platform, and buy no parallelism that matters.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one platform is worth seeing beside the others: whether a
      # break is platform-specific is the first question asked about it.
      fail-fast: false
      matrix:
        # `windows-2025` is left out while its run takes about twice as long as
        # the other two (12 to 15 minutes against 7 to 9) and holds every push
        # that long; it goes back in once its run is as quick as theirs.
        os:
          - ubuntu-26.04
          - xcode-27
    steps:
      # No later step fetches or pushes through git with the job's token, so
      # it is not left in `.git/config`, where every build script and proc
      # macro the job compiles could read it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `rustup toolchain install` with no toolchain named installs the one
      # rust-toolchain.toml names, with its components. Whether a bare cargo
      # call would install it depends on the runner's rustup settings.
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update

      # The dependencies' build output is kept between runs; the crates of this
      # repository are rebuilt every time. The key holds the toolchain, the
      # manifest of each package and the lock files, so a changed dependency
      # or compiler starts a cache of its own, which is why this step comes
      # after the toolchain. The root manifest is a virtual one, not a package,
      # so it is not in the key: a change to `[workspace.dependencies]` that
      # leaves Cargo.lock alone keeps the key, the old cache is restored, and
      # cargo rebuilds what is stale, on every run until the key moves. The
      # fuzz targets are a second workspace with a target directory of their
      # own. Only a run on `main` saves: a pull request restores what `main`
      # built and cannot replace it. `~/.cargo/bin` is left out, because the
      # step below downloads those tools prebuilt in seconds and a restored
      # copy would only stand in the way of a newer release.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-hack,cargo-deny

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The same lints with no features at all. Code reachable only through a
      # feature, or only from tests, is dead in this build, and the run above
      # cannot see that: every feature is on there.
      - name: Lints without default features
        run: cargo clippy --workspace --exclude typesafe-sdk-rust-live-tests --exclude typesafe-sdk-rust-adapter-live-tests --all-targets --no-default-features -- -D warnings

      - name: Lints with default features
        run: cargo clippy --workspace --exclude typesafe-sdk-rust-live-tests --exclude typesafe-sdk-rust-adapter-live-tests --all-targets -- -D warnings

      # No `--workspace`: this one runs code. A crate whose tests need a live
      # API key is a workspace member and not a default member, so the default
      # selection is the one that can never reach it.
      - name: Tests
        run: cargo nextest run --all-features

      - name: Tests with the default JSON backend
        run: cargo nextest run --features internals

      - name: Tests with unified arbitrary-precision numbers
        run: env TYPESAFE_SDK_TEST_ARBITRARY_PRECISION=1 cargo nextest run --features internals,serde_json/arbitrary_precision

      - name: Tests without default features
        run: cargo nextest run --no-default-features

      # The same tests under libtest, which runs the tests of one binary as
      # threads of one process where nextest gives each its own: state that
      # one test leaves in the process (a cached tracing interest, once) can
      # only show here. One platform is enough for a harness difference. No
      # `--workspace`, for the reason given at Tests; the doctests have
      # their own step.
      - name: Tests under libtest
        if: matrix.os == 'ubuntu-26.04'
        run: cargo test --all-features --tests

      - name: Tests under libtest with the default JSON backend
        if: matrix.os == 'ubuntu-26.04'
        run: cargo test --features internals --tests

      - name: Doctests with default features
        run: cargo test --doc

      - name: Doctests
        run: cargo test --doc --all-features

      # trybuild runs a cargo of its own, which never sees the `--config`
      # flags of the cargo that started the test, so a contributor who moves
      # the target directory with `--config` gets the derive test's other
      # path: it runs itself again with CARGO_TARGET_DIR set to where it was
      # built. The steps above never take that path (trybuild finds the
      # default directory too), so this one does, on each platform, and
      # checks that it did: a re-run prints libtest's header twice. bash on
      # every runner, so the quoting is the same on Windows; the directory is
      # a TOML literal string, whose backslashes stay backslashes.
      - name: The derive's compile-fail cases under a target dir set by --config
        shell: bash
        run: |
          unset CARGO_TARGET_DIR
          log="${RUNNER_TEMP}/trybuild-rerun.log"
          cargo --config "build.target-dir='${RUNNER_TEMP}/target-by-config'" \
            test --all-features --test derive -- misuse --nocapture | tee "${log}"
          test "$(grep -c '^running 1 test' "${log}")" -eq 2

      # Every combination of features, not just none and all: a feature that
      # only compiles because another one happens to be on is a break for the
      # caller who enables it alone. `--no-dev-deps` is what exposes it -
      # a feature a dev-dependency enables hides a missing one in the real
      # dependencies. Clippy rather than check, with warnings denied, so that
      # code dead in one of the combinations between none and all fails too.
      - name: Feature combinations
        run: cargo hack clippy --workspace --feature-powerset --no-dev-deps -- -D warnings

      - name: Dependency policy
        run: cargo deny check

      # The fuzz targets are a workspace of their own with a lock file of
      # their own, which the step above never reads.
      - name: Dependency policy of the fuzz targets
        run: cargo deny --manifest-path fuzz/Cargo.toml check

      # A link to an item that is private, renamed or gone still renders; it
      # just renders as text that goes nowhere, which nobody notices in a
      # review. Denying rustdoc's warnings is what turns that into a failure.
      - name: Documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Documentation without default features
        run: cargo doc --no-deps --no-default-features -p typesafe-sdk-rust
        env:
          RUSTDOCFLAGS: -D warnings

      # Running the fuzz targets needs nightly; checking them does not:
      # stable compiles them, together with libFuzzer's C++ runtime, so a
      # change to the hidden seam they call through breaks here instead of
      # on the next fuzzing run. One platform is enough for a compile check;
      # `--locked` holds it to the committed lock file.
      - name: Fuzz targets compile
        if: matrix.os == 'ubuntu-26.04'
        run: cargo check --locked --manifest-path fuzz/Cargo.toml

      # The step above builds the targets against serde_json, the default
      # backend. sonic-rs carries far more `unsafe` code than serde_json (its
      # SIMD parser), and that is the backend a fuzzing run is most for, so the
      # targets are checked against it too: a target that no longer builds
      # with it breaks here, not on the next fuzzing run. The fuzz crate's own
      # `sonic` feature is what holds sonic-rs to the committed lock file under
      # `--locked`.
      - name: Fuzz targets compile with the sonic backend
        if: matrix.os == 'ubuntu-26.04'
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --features sonic

  coverage:
    name: coverage
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update

      # Coverage is the one thing here that needs a component beyond what
      # rust-toolchain.toml installs for everybody, so it is added by the job
      # that needs it rather than by every developer's first build.
      - name: Install the coverage instrumentation
        run: rustup component add llvm-tools-preview

      # As in the check job. The instrumented build lives under `target` too,
      # and this job's key is its own, so the two never share an entry.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # The threshold covers the published crates only, each on its own: the
      # test-support server is exercised by the tests that use it, and
      # counting it, or one crate with the other, would let its lines pay for
      # lines that nothing reaches.
      - name: Line coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest -p typesafe-sdk-rust --all-features --no-report
          cargo llvm-cov nextest -p typesafe-sdk-rust --features internals --no-report
          cargo llvm-cov report -p typesafe-sdk-rust --fail-under-lines 85

      # The derive's entry point runs only inside rustc, never under a test
      # harness, so it counts as unreached; everything it calls is measured.
      - name: Line coverage of the derive
        run: cargo llvm-cov nextest -p typesafe-sdk-rust-macros --all-features --fail-under-lines 85

  hygiene:
    name: text hygiene
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Invisible and control characters
        run: python3 .github/scripts/text-hygiene.py

      - name: No placeholders
        run: python3 .github/scripts/no-placeholders.py

      - name: Port test matrix
        run: python3 .github/scripts/port-test-matrix.py

      # cargo packages only the files inside a package's directory, so the SDK
      # carries its own README (the crate docs embed it) and licenses, and the
      # derive its own licenses. They are copies of the root files rather than
      # symlinks: a checkout without `core.symlinks`, the Windows default,
      # turns a symlink into a one-line text file. A copy that differs from
      # the root file fails here, with the first byte that differs.
      - name: Package copies of the README and licenses
        run: |
          cmp README.md crates/sdk/README.md
          cmp LICENSE crates/sdk/LICENSE
          cmp LICENSE-THIRD-PARTY crates/sdk/LICENSE-THIRD-PARTY
          cmp LICENSE crates/macros/LICENSE
          cmp LICENSE-THIRD-PARTY crates/macros/LICENSE-THIRD-PARTY

      # pipx ships with the runner image and runs pytest from a throwaway
      # environment, so nothing is installed into the image's Python.
      - name: Tests of the scripts
        run: pipx run --spec 'pytest==9.*' pytest .github/scripts/tests -q
