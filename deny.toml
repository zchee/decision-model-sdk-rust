# cargo-deny policy for the workspace and for the fuzz targets under fuzz/.
#
# CI runs it at the workspace root, where every workspace member is a root of
# the graph (the SDK, the derive, the test server and the live tests), and
# with `--manifest-path fuzz/Cargo.toml` for the fuzz targets' graph.

[graph]
# Restricting the graph to the supported triples keeps platform-only crates
# out of the license and advisory verdict. Notably it drops the wasm-only
# webpki-root-certs (CDLA-Permissive-2.0), which is not a license this project
# accepts and which no supported target pulls in.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = true

[advisories]
# A yanked release is a maintainer telling downstreams not to use it, so it
# fails rather than warns. Vulnerability and unsound advisories are denied
# unconditionally by cargo-deny 0.20 and have no key here.
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
# Permissive licenses with no source-disclosure or patent-retaliation terms.
# Anything outside this list is a decision for the repository owner, so the
# list is never widened to make a check pass.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# One crate, one license, the owner's decision of 2026-09-19; the allow list
# above stays as it is. libfuzzer-sys bundles the libFuzzer C++ runtime, which
# is under NCSA.
exceptions = [
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]
# The allow list is a policy statement, not an inventory of what the current
# lock file happens to contain, so a listed license nothing uses today is not
# a finding.
unused-allowed-license = "allow"
# The same config checks the root workspace, whose graph has no libfuzzer-sys,
# and fuzz/, whose graph has it, so the exception above is unused in one of
# the two runs by design.
unused-license-exception = "allow"

[licenses.private]
# The workspace's own unpublished members (test-support, live-tests) carry the
# same license as the SDK, so there is nothing to skip.
ignore = false

[bans]
# Two versions of one crate is a graph smell, not a policy violation: it costs
# compile time and binary size, and the fix is usually upstream.
multiple-versions = "warn"
# Every dependency in this project is pinned to a concrete minimum version.
wildcards = "deny"
# Except a path dev-dependency, which has no version on purpose: cargo strips
# it when it publishes, and a versioned one would make publishing require the
# test-support crate on crates.io. A path or git normal or build dependency of
# a published crate is still refused.
allow-wildcard-paths = true
highlight = "all"
allow = []
# The owner allowed NCSA for libfuzzer-sys on the condition that it is
# reachable only from the unpublished fuzz/ workspace. This entry is that
# condition: the fuzz crate may depend on libfuzzer-sys directly, and a
# direct dependency from any other crate fails the check, so libfuzzer-sys
# enters a graph only through the fuzz crate. In the root graph, which has no
# libfuzzer-sys, cargo-deny warns `unused-wrapper`; that warning is expected.
deny = [
    { crate = "libfuzzer-sys", wrappers = ["typesafe-sdk-rust-fuzz"] },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
