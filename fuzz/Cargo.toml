# libFuzzer targets for the two parsers that read bytes a server chose: the
# response decoders and the `Retry-After` parser. The crate has a workspace of
# its own and is excluded from the root one. Running a target needs the
# nightly toolchain and a sanitizer. It is never published.
[package]
name = "typesafe-sdk-rust-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
# The root workspace's license, spelled out because this is a workspace of its
# own: `cargo deny` refuses a crate without one, private or not.
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
# `internals` is the seam the targets reach the crate-private decoders
# through; the default features stay on, so a derived answer set is decoded
# too.
typesafe-sdk-rust = { path = "..", features = ["internals"] }
# The same versions the SDK itself resolves, for building its inputs.
bytes = "1.12.1"
http = "1.5.0"

[features]
# The SDK's sonic-rs JSON backend, whose SIMD parser carries far more `unsafe`
# code than serde_json: `cargo fuzz run --features sonic <target>`. It is a
# feature of this crate because a feature declared here is what puts sonic-rs
# and its dependencies into this workspace's lock file, where `--locked` holds
# their versions and `cargo deny` judges the ones a supported target builds.
# Without it, `--features typesafe-sdk-rust/sonic` on the command line builds
# as well, but cargo resolves that tree outside the lock file, at the newest
# versions the index has, and neither check sees it.
sonic = ["typesafe-sdk-rust/sonic"]

# An empty table makes this directory a workspace root of its own, so cargo
# stops here instead of walking up into the repository's workspace.
[workspace]

[[bin]]
name = "decode_response"
path = "fuzz_targets/decode_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "retry_after"
path = "fuzz_targets/retry_after.rs"
test = false
doc = false
bench = false
